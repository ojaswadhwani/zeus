name: Operational beta package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.3.0-beta.2'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check package version
        run: |
          package_id=$(cargo pkgid --locked)
          version=${package_id##*[@#]}
          test "$version" = "0.3.0-beta.2"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Run release tests
        run: cargo test --locked --release --all-features --all-targets
      - name: Build and check the Linux package
        run: |
          bash scripts/package-linux.sh beta
          bash scripts/verify-linux-beta.sh target/beta 0.3.0-beta.2 "$RUNNER_TEMP/zeus-beta"
      - name: Rehearse the upgrade with the extracted package
        run: |
          preview_source=$(mktemp -d)
          git archive v0.2.0-preview | tar -x -C "$preview_source"
          cargo build --locked --release --features replication --bin zeus-node \
            --manifest-path "$preview_source/Cargo.toml" --target-dir "$RUNNER_TEMP/zeus-preview"
          export ZEUS_PREVIEW_BIN="$RUNNER_TEMP/zeus-preview/release/zeus-node"
          export ZEUS_CANDIDATE_BIN="$RUNNER_TEMP/zeus-beta/zeus-0.3.0-beta.2-linux-x86_64/zeus-node"
          cargo test --locked --release --features replication --test node_server \
            offline_preview_upgrade_preserves_state_and_allows_prewrite_rollback -- --ignored
      - name: Sign build provenance for the release archive
        if: github.ref == 'refs/tags/v0.3.0-beta.2'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: target/beta/zeus-0.3.0-beta.2-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zeus-operational-beta-linux-x86_64
          path: target/beta/
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/tags/v0.3.0-beta.2'
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify release downloads and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="zeus-$version-linux-x86_64.tar.gz"
          gh run download "$GITHUB_RUN_ID" --name zeus-operational-beta-linux-x86_64 --dir dist
          gh release create "$GITHUB_REF_NAME" "dist/$archive" dist/SHA256SUMS \
            --verify-tag --draft --prerelease --latest=false \
            --title "Zeus $version" --notes-file docs/operational-beta-notes.md
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          gh attestation verify "release-assets/$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/operational-beta.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$(git rev-parse HEAD)"
          bash scripts/verify-linux-beta.sh release-assets "$version" "$RUNNER_TEMP/zeus-release"
          gh release edit "$GITHUB_REF_NAME" --draft=false
